name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  artifact-metadata: write
  attestations: write
  contents: write
  id-token: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    environment: marketplace
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Verify tag and package metadata
        run: node scripts/check-release-tag.mjs "$GITHUB_REF_NAME"
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Run release gates
        run: |
          npm test
          npm run lint
          npm audit
      - name: Build VSIX
        run: npm run package:vscode
      - name: Generate checksums
        run: sha256sum dist/*.vsix > dist/SHA256SUMS.txt
      - name: Attest release artifact
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*.vsix
      - name: Sign in to Azure with GitHub OIDC
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - name: Publish to Visual Studio Marketplace
        run: npx --no-install vsce publish --azure-credential --packagePath dist/*.vsix --skip-duplicate
      - name: Create immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          dist/*.vsix dist/SHA256SUMS.txt
          --verify-tag
          --generate-notes
          --title "Turntrail ${GITHUB_REF_NAME#v}"
